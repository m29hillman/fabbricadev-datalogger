; Waveshare ESP32-S3-RS485-CAN (SKU 32154)
; Modulo ESP32-S3R8: 16 MB flash, 8 MB PSRAM octal, console na USB CDC.

[env:esp32-s3-rs485-can]
platform = espressif32
board = esp32-s3-devkitc-1
;board = esp32-s3-rs485-can
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_16MB.csv
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
lib_deps = knolleary/PubSubClient@^2.8.0
board_build.embed_files =
    src/img/logo-fundo-claro.png
    src/img/logo-fundo-escuro.png
